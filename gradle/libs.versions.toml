[versions]
#lib version
#noinspection UnusedVersionCatalogEntry
common-utils = "1.5.7"

#noinspection UnusedVersionCatalogEntry
compileSdk = "37"
#noinspection UnusedVersionCatalogEntry
compileSdkMinor = "1"
#noinspection UnusedVersionCatalogEntry
jvmTarget = "21"

aboutlibraries = "15.3.0"
activity-compose = "1.13.0"
agp = "9.4.1"
androidx-test = "1.7.0"
androidx-test-espresso = "3.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
app-update = "2.1.0"
asm = "9.11.1"
binary-compatibility-validator = "0.18.2"
core-splashscreen = "1.2.0"
coroutines = "1.11.0"
dependency-analysis = "3.19.2"
detekt = "2.0.0-alpha.6"
hilt = "2.60.1"
junit-jupiter = "6.1.3"
junit4 = "4.13.2"
konsist = "0.18.1"
kotest = "6.2.6"
kotlin = "2.4.21"
kover = "0.9.11"
ksp = "2.3.12"
# Used via spotless { kotlin { ktlint(libs.versions.ktlint.get()) } } — version-only ref, no library/plugin alias
#noinspection UnusedVersionCatalogEntry
ktlint = "1.7.1"
lottie = "6.7.1"
material3 = "1.4.0"
compose-ui-test = "1.12.1"
mockk = "1.14.11"
oneui-design = "0.9.20+oneui8"
oneui-icons = "1.1.0"
review = "2.0.2"
robolectric = "4.17"
roborazzi = "1.76.0"
spotless = "8.10.4"
turbine = "1.2.1"

[libraries]
abi-asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
abi-asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
abi-kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
aboutlibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutlibraries" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose-ui-test" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
androidx-test-espresso-intents = { module = "androidx.test.espresso:espresso-intents", version.ref = "androidx-test-espresso" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
app-update = { module = "com.google.android.play:app-update", version.ref = "app-update" }
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-jupiter" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junit-jupiter" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
oneui-design = { module = "io.github.tribalfs:oneui-design", version.ref = "oneui-design" }
oneui-icons = { module = "io.github.oneuiproject:icons", version.ref = "oneui-icons" }
review = { module = "com.google.android.play:review", version.ref = "review" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[bundles]
android-test = ["androidx-test-core", "androidx-test-runner", "androidx-test-ext-junit", "androidx-test-espresso-intents"]
robolectric-test = ["robolectric", "roborazzi", "androidx-test-core", "androidx-test-espresso-core"]
unit-test = ["kotest-runner-junit5", "kotest-assertions-core", "kotest-property", "mockk", "turbine", "kotlinx-coroutines-test"]

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
maven-publish = { id = "maven-publish" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
signing = { id = "signing" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

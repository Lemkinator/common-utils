name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run formatting checks
        run: chmod +x ./gradlew && ./gradlew spotlessCheck detekt --stacktrace
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: lib/build/reports/detekt/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run lint
        run: chmod +x ./gradlew && ./gradlew lintDebug --stacktrace
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: lib/build/reports/lint-results-*

  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run unit tests
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest verifyRoborazziDebug koverXmlReportDebug koverHtmlReportDebug koverVerifyDebug --stacktrace
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lib/build/reports/kover/reportDebug.xml
          flags: unittests
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: lib/build/test-results/testDebugUnitTest/*.xml
          flags: unittests
      - name: Upload coverage report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-report
          path: lib/build/reports/kover/htmlDebug/
      - name: Upload roborazzi diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-diff
          path: lib/build/reports/roborazzi/
      # Gradle's console summary prints only "<exceptionClass> at <frame>" for a failed test -
      # the actual message and stack trace live in these reports, so without them a red
      # local-tests job can't be diagnosed from the logs alone.
      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            lib/build/reports/tests/testDebugUnitTest/
            lib/build/test-results/testDebugUnitTest/

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # AGP's managed-device setup task (:lib:pixel9Api35Setup) otherwise downloads the ~1GB
      # system image mid-build with no retry, so a single truncated response from dl.google.com
      # fails the whole job ("Archive is not a ZIP archive"). Installing the same packages up
      # front, with retries, makes that task a no-op. Keep the package name in sync with the
      # pixel9Api35 device in the root build.gradle.kts (systemImageSource "aosp" -> "default",
      # apiLevel 35, testedAbi "x86_64").
      - name: Install Android system image
        run: |
          set -euo pipefail
          # Resolve the SDK the same way AGP does (ANDROID_HOME first), so this installs into
          # the very SDK the Gradle run will read - otherwise the pre-install silently no-ops.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set"
            exit 1
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK or on PATH"
            exit 1
          fi
          PKG="system-images;android-35;default;x86_64"
          IMG_DIR="$SDK/system-images/android-35/default/x86_64"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          for attempt in 1 2 3; do
            # package.xml is written only once an install completes, so it catches the
            # truncated-download case that sdkmanager itself only reports as a warning.
            if "$SDKMANAGER" --install "$PKG" "emulator" "platforms;android-35" \
                 && [ -f "$IMG_DIR/package.xml" ]; then
              echo "Installed $PKG on attempt $attempt"
              exit 0
            fi
            echo "::warning::sdkmanager attempt $attempt failed; clearing partial download"
            rm -rf "$IMG_DIR" "$SDK/.temp" "$SDK/.downloadIntermediates"
            sleep $((attempt * 15))
          done
          echo "::error::Failed to install $PKG after 3 attempts"
          exit 1
      - name: Run instrumented tests (GMD)
        run: chmod +x ./gradlew && ./gradlew pixel9Api35DebugAndroidTest --stacktrace
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Assemble release
        run: chmod +x ./gradlew && ./gradlew assembleRelease --stacktrace
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
